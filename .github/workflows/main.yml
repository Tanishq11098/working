name: Daily Technical Internship Bot

permissions:
  contents: write # Needed to commit and persist internships.xlsx back to repository

concurrency:
  group: internship-bot-execution
  cancel-in-progress: false

on:
  schedule:
    # 02:30 UTC corresponds to 08:00 AM Indian Standard Time (IST)
    - cron: '30 2 * * *'
  workflow_dispatch:

jobs:
  run-internship-bot:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Configuration (Safe Check)
        run: |
          echo "Checking configured credentials without exposing secrets..."
          if [ -n "${{ secrets.GMAIL_ADDRESS }}" ] && [ -n "${{ secrets.GMAIL_APP_PASSWORD }}" ]; then
            echo "Email credentials: CONFIGURED"
          else
            echo "Email credentials: NOT CONFIGURED (Email step will be safely skipped)"
          fi
          if [ -n "${{ secrets.APIFY_API_TOKEN }}" ]; then
            echo "Apify credentials: CONFIGURED"
          else
            echo "Apify credentials: NOT CONFIGURED (Apify sources will be safely skipped)"
          fi

      - name: Run Job Hunting Bot
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
          APIFY_ACTOR_ID: ${{ vars.APIFY_ACTOR_ID }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          JSEARCH_API_KEY: ${{ secrets.JSEARCH_API_KEY }}
          STRICT_LOCATION: 'true'
          EXCEL_FILENAME: 'internships.xlsx'
        run: python internship_bot.py

      - name: Validate Master Workbook
        run: |
          python -c "
          import openpyxl, sys
          wb = openpyxl.load_workbook('internships.xlsx')
          required = {'All Listings', 'Source Stats', 'seen_listings', 'Tracker'}
          missing = required - set(wb.sheetnames)
          if missing:
              print(f'ERROR: Missing sheets: {missing}')
              sys.exit(1)
          print('Workbook validation successful: all 4 worksheets present.')
          "

      - name: Persist Updated Workbook to Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add internships.xlsx
          if git diff --staged --quiet; then
            echo "No changes in internships.xlsx to commit."
          else
            # [skip ci] prevents infinite recursive workflow triggers
            git commit -m "Auto-update internships.xlsx [skip ci]"
            git pull --rebase origin main || git pull --rebase origin master || true
            git push origin HEAD
            echo "Successfully persisted internships.xlsx to repository."
          fi

      - name: Upload Single Excel Digest Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: internship-report
          path: internships.xlsx
          retention-days: 30
          if-no-files-found: error
